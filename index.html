<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MR.SKY Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tab Strip -->
  <div class="tabs-container">
    <div id="tabs" class="tabs"></div>
    <button class="new-tab-btn" onclick="createTab()" title="New Tab">+</button>
  </div>

  <!-- Navigation Bar -->
  <div class="navbar">
    <button class="nav-btn" onclick="back()" title="Back">⬅</button>
    <button class="nav-btn" onclick="forward()" title="Forward">➡</button>
    <button class="nav-btn" id="reload-btn" onclick="reload()" title="Reload">⟳</button>
    <button class="nav-btn" onclick="home()" title="Home">🏠</button>

    <div class="url-bar-container">
      <input id="url" type="text" placeholder="Search Google or enter address..." spellcheck="false" autocomplete="off" />
    </div>

    <button class="go-btn" onclick="go()">Go</button>
    <button class="nav-btn" onclick="showHistory()" title="Browsing History">🕘</button>
  </div>

  <!-- Webviews Container -->
  <div id="webviews"></div>

  <script src="renderer.js"></script>
</body>
</html>
