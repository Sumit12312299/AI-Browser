<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MR.SKY Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Tab Strip -->
  <div class="tabs-container">
    <div id="tabs" class="tabs"></div>
    <button class="new-tab-btn" onclick="createTab()" title="New Tab (Ctrl+T)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <div class="navbar">
    <div class="nav-controls">
      <button class="nav-btn" onclick="back()" title="Back (Alt+Left)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="nav-btn" onclick="forward()" title="Forward (Alt+Right)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="nav-btn" id="reload-btn" onclick="reload()" title="Reload (Ctrl+R)">
        <svg class="reload-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button class="nav-btn" onclick="home()" title="Home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </button>
    </div>

    <!-- Smart Address & Search Capsule -->
    <div class="url-bar-container">
      <div class="url-bar-wrapper">
        <div class="search-icon-wrapper">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input id="url" type="text" placeholder="Search Google or enter address... (Ctrl+L)" spellcheck="false" autocomplete="off" />
        <button class="go-btn" onclick="go()" title="Go (Enter)">
          <span>Go</span>
        </button>
      </div>
    </div>

    <!-- Features & Quick Actions -->
    <div class="nav-actions">
      <!-- 🛡️ Built-in AdBlocker -->
      <button class="adblock-btn active" id="adblock-toggle" onclick="toggleAdBlocker()" title="AdBlocker Active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
        <span class="adblock-badge" id="adblock-count">0</span>
      </button>

      <!-- 🕘 History Button -->
      <button class="nav-btn" onclick="showHistory()" title="Browsing History (Ctrl+H)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>

      <!-- ✨ AI Copilot Trigger -->
      <button class="copilot-btn" id="copilot-toggle-btn" onclick="toggleCopilot()" title="Toggle AI Copilot (Ctrl+Space)">
        <svg class="copilot-sparkle" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
        </svg>
        <span>Copilot</span>
      </button>
    </div>
  </div>

  <!-- Main View Area (Webviews + AI Copilot Sidebar) -->
  <div class="main-content-layout">
    <div id="webviews"></div>

    <!-- 🤖 AI Copilot Collapsible Sidebar -->
    <aside id="ai-sidebar" class="ai-sidebar">
      <div class="copilot-header">
        <div class="copilot-brand">
          <div class="copilot-icon-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
            </svg>
          </div>
          <div>
            <div class="copilot-name">MR.SKY Copilot</div>
            <div class="copilot-status">Active Page AI Assistant</div>
          </div>
        </div>

        <div class="copilot-header-actions">
          <button class="icon-action-btn" onclick="openCopilotSettings()" title="Settings / API Key">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button class="icon-action-btn" onclick="toggleCopilot()" title="Close Copilot (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Current Page Context Chip -->
      <div class="active-context-banner" id="copilot-context">
        <span class="context-pulse"></span>
        <span class="context-title" id="copilot-context-title">Loading page info...</span>
      </div>

      <!-- Quick Action Prompts -->
      <div class="copilot-quick-actions">
        <button class="quick-chip" onclick="copilotSummarize()">
          <span>Summarize</span>
        </button>
        <button class="quick-chip" onclick="copilotKeyTakeaways()">
          <span>Key Points</span>
        </button>
        <button class="quick-chip" onclick="copilotExplainSimple()">
          <span>Explain Simple</span>
        </button>
      </div>

      <!-- Chat History Stream -->
      <div class="copilot-messages" id="copilot-messages">
        <div class="message ai-message">
          <div class="msg-avatar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <div class="msg-content">
            Hello! I am your <strong>MR.SKY Copilot</strong>. I can read, summarize, and answer questions about any page you are browsing. Click an action above or ask a question.
          </div>
        </div>
      </div>

      <!-- Input Capsule -->
      <div class="copilot-input-area">
        <div class="copilot-input-wrapper">
          <input type="text" id="copilot-input" placeholder="Ask about this page..." autocomplete="off" />
          <button class="copilot-send-btn" id="copilot-send-btn" onclick="handleCopilotSend()" title="Send">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
