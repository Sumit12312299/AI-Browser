<!DOCTYPE html>
<html>
<head>
<title>MR.SKY</title>
<style>
body {
  background: radial-gradient(circle, #000, #020024);
  color: #00ffcc;
  font-family: monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
}
h1 { font-size: 48px; margin-bottom: 10px; }
form {
  display: flex;
  gap: 10px;
}
input {
  padding: 10px;
  width: 300px;
  background: #000;
  color: #0ff;
  border: 1px solid #0ff;
}
button {
  padding: 10px 20px;
  background: #0ff;
  color: #000;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  background: #00cc99;
}
.ai-buttons {
  margin-top: 20px;
  display: flex;
  gap: 15px;
}

.ai-buttons button {
  padding: 10px 18px;
  background: transparent;
  color: #0ff;
  border: 1px solid #0ff;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

.ai-buttons button:hover {
  background: #0ff;
  color: #000;
}

</style>
</head>
<body>
<h1>MR.SKY</h1>
<p>Powered by Chromium 👁️</p>

<form id="searchForm">
  <input type="text" id="searchInput" placeholder="Search the web..." />
  <button type="submit">Go</button>
</form>

<div class="ai-buttons">
  <button onclick="openAI('chatgpt')">ChatGPT</button>
  <button onclick="openAI('gemini')">Gemini</button>
  <button onclick="openAI('deepseek')">DeepSeek</button>
  <button onclick="openAI('claude')">Claude</button>
</div>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('searchInput');
  
  form.addEventListener('submit', function(e) {
    e.preventDefault();
  
    const query = input.value.trim();
    if (!query) return;
  
    let url;
    if (query.startsWith('http')) {
      url = query;
    } else {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
    }
  
    // ✅ THIS WORKS INSIDE ELECTRON WEBVIEW
    window.location.href = url;
  });

function openAI(type) {
  let url = "";

  if (type === "chatgpt") {
    url = "https://chat.openai.com/";
  } else if (type === "gemini") {
    url = "https://gemini.google.com/";
  } else if (type === "deepseek") {
    url = "https://chat.deepseek.com/";
  } else if (type === "claude") {
    url = "https://claude.ai/";
  }

  window.location.href = url; // ✅ correct for webview
}


  </script>
  

</body>
</html>
