<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MR.SKY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d13;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 30px 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Minimalist Background */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Status Bar */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }

    .clock-widget {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Main Container */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 820px;
    }

    /* Clean Brand Title */
    .brand-title {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: #64748b;
      letter-spacing: 0.2px;
      margin-bottom: 32px;
      font-weight: 500;
    }

    /* Clean Search Bar */
    .search-wrapper {
      width: 100%;
      max-width: 620px;
      margin-bottom: 44px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 5px 6px 5px 16px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .search-form:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .search-form:focus-within {
      border-color: #3b82f6;
      background: #0f121a;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .search-icon {
      margin-right: 12px;
      display: flex;
      align-items: center;
      color: #64748b;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14.5px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .search-input::placeholder {
      color: #4b5563;
    }

    .search-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .search-btn:hover {
      background: #1d4ed8;
    }

    /* Section Label */
    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* AI Cards Grid */
    .ai-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      margin-bottom: 34px;
    }

    .ai-card {
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ai-card:hover {
      background: #191d2b;
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .ai-icon-container {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
      color: #94a3b8;
    }

    .ai-card:hover .ai-icon-container {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .ai-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .ai-desc {
      font-size: 11.5px;
      color: #64748b;
      text-align: center;
      line-height: 1.35;
    }

    /* Clean Shortcuts Row */
    .shortcuts-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }

    .shortcut-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #8b9bb4;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .shortcut-pill:hover {
      background: #191d2b;
      border-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Subtle Minimal Dot Grid -->
  <div class="bg-grid"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>CHROMIUM ENGINE ACTIVE</span>
    </div>
    <div class="clock-widget" id="liveClock">00:00:00</div>
  </div>

  <!-- Hero Content -->
  <div class="hero-container">
    <h1 class="brand-title">MR.SKY</h1>
    <p class="brand-subtitle">AI-Augmented Next-Gen Desktop Browser</p>

    <!-- Search Form -->
    <div class="search-wrapper">
      <form class="search-form" id="searchForm">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search the web with Google or enter URL..." autofocus autocomplete="off" />
        <button type="submit" class="search-btn">Search</button>
      </form>
    </div>

    <!-- AI Launchpad -->
    <div class="section-title">
      <span>AI Launchpad</span>
    </div>

    <div class="ai-grid">
      <!-- ChatGPT -->
      <div class="ai-card" onclick="openAI('chatgpt')">
        <div class="ai-icon-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10v4a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6v-4a10 10 0 0 1 10-10z"></path>
            <path d="M8 11h.01"></path>
            <path d="M16 11h.01"></path>
          </svg>
        </div>
        <div class="ai-title">ChatGPT</div>
        <div class="ai-desc">GPT-4o & Advanced Reasoning</div>
      </div>

      <!-- Gemini -->
      <div class="ai-card" onclick="openAI('gemini')">
        <div class="ai-icon-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"></path>
          </svg>
        </div>
        <div class="ai-title">Gemini</div>
        <div class="ai-desc">Google Multimodal Intelligence</div>
      </div>

      <!-- DeepSeek -->
      <div class="ai-card" onclick="openAI('deepseek')">
        <div class="ai-icon-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9 10h.01"></path>
            <path d="M15 10h.01"></path>
            <path d="M9 15c1 1 5 1 6 0"></path>
          </svg>
        </div>
        <div class="ai-title">DeepSeek</div>
        <div class="ai-desc">Deep Math & Code Reasoning</div>
      </div>

      <!-- Claude -->
      <div class="ai-card" onclick="openAI('claude')">
        <div class="ai-icon-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 3v3m0 12v3M3 12h3m12 0h3"></path>
          </svg>
        </div>
        <div class="ai-title">Claude</div>
        <div class="ai-desc">Next-Gen Thinking & Artifacts</div>
      </div>
    </div>

    <!-- Quick Shortcuts -->
    <div class="shortcuts-row">
      <div class="shortcut-pill" onclick="openURL('https://youtube.com')">
        <span>YouTube</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://github.com')">
        <span>GitHub</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://reddit.com')">
        <span>Reddit</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://wikipedia.org')">
        <span>Wikipedia</span>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      let url;
      if (query.startsWith('http://') || query.startsWith('https://')) {
        url = query;
      } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(query)) {
        url = 'https://' + query;
      } else {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }
      window.location.href = url;
    });

    function openAI(type) {
      const urls = {
        chatgpt: "https://chatgpt.com/",
        gemini: "https://gemini.google.com/",
        deepseek: "https://chat.deepseek.com/",
        claude: "https://claude.ai/"
      };
      if (urls[type]) {
        window.location.href = urls[type];
      }
    }

    function openURL(url) {
      window.location.href = url;
    }
  </script>
</body>
</html>
