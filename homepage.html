<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MR.SKY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #080a10;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 30px 20px;
    }

    /* ══════════════════════════════════════════════════════════════════
       ANIMATED BACKGROUND ORBS & GRID
       ══════════════════════════════════════════════════════════════════ */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.28;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #00ffcc, #0077b6);
      top: 5%;
      left: 15%;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #7928ca, #ff0080);
      bottom: 5%;
      right: 15%;
      animation-duration: 16s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* ══════════════════════════════════════════════════════════════════
       TOP STATUS BAR (CLOCK & ENGINE)
       ══════════════════════════════════════════════════════════════════ */
    .top-bar {
      position: absolute;
      top: 25px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 20px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ffcc;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .clock-widget {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
    }

    /* ══════════════════════════════════════════════════════════════════
       HERO BRAND
       ══════════════════════════════════════════════════════════════════ */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 860px;
      margin-top: 20px;
    }

    .brand-title {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #00ffcc 50%, #00b4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(0, 255, 204, 0.35));
      margin-bottom: 8px;
      animation: titleGlow 4s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.25)); }
      100% { filter: drop-shadow(0 0 35px rgba(0, 255, 204, 0.6)); }
    }

    .brand-subtitle {
      font-size: 14px;
      color: #798ba3;
      letter-spacing: 1px;
      margin-bottom: 35px;
      font-weight: 500;
    }

    /* ══════════════════════════════════════════════════════════════════
       SEARCH FORM CAPSULE
       ══════════════════════════════════════════════════════════════════ */
    .search-wrapper {
      width: 100%;
      max-width: 650px;
      margin-bottom: 40px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: rgba(18, 22, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 6px 8px 6px 20px;
      backdrop-filter: blur(16px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .search-form:hover {
      border-color: rgba(0, 255, 204, 0.4);
      box-shadow: 0 10px 35px -5px rgba(0, 255, 204, 0.15);
    }

    .search-form:focus-within {
      border-color: #00ffcc;
      background: rgba(15, 18, 28, 0.98);
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.08);
      transform: translateY(-2px);
    }

    .search-icon {
      margin-right: 14px;
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .search-btn {
      background: linear-gradient(135deg, #00ffcc 0%, #00b4d8 100%);
      color: #030812;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 22px;
      border-radius: 22px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 255, 204, 0.3);
    }

    .search-btn:hover {
      background: linear-gradient(135deg, #33ffd9 0%, #1ec2e8 100%);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
      transform: scale(1.04);
    }

    /* ══════════════════════════════════════════════════════════════════
       AI LAUNCHPAD CARDS (3D HOVER & GLOW)
       ══════════════════════════════════════════════════════════════════ */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffcc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ai-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      margin-bottom: 35px;
    }

    .ai-card {
      background: rgba(18, 22, 34, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .ai-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      transition: background 0.25s ease;
    }

    .ai-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.7);
    }

    /* Card Specific Colors */
    .ai-card.chatgpt:hover {
      border-color: #10a37f;
      box-shadow: 0 10px 30px -5px rgba(16, 163, 127, 0.35);
    }
    .ai-card.chatgpt::before { background: #10a37f; }

    .ai-card.gemini:hover {
      border-color: #438bf7;
      box-shadow: 0 10px 30px -5px rgba(67, 139, 247, 0.35);
    }
    .ai-card.gemini::before { background: linear-gradient(90deg, #438bf7, #8e44ad); }

    .ai-card.claude:hover {
      border-color: #d97706;
      box-shadow: 0 10px 30px -5px rgba(217, 119, 6, 0.35);
    }
    .ai-card.claude::before { background: #d97706; }

    .ai-card.deepseek:hover {
      border-color: #00ffcc;
      box-shadow: 0 10px 30px -5px rgba(0, 255, 204, 0.35);
    }
    .ai-card.deepseek::before { background: #00ffcc; }

    .ai-icon-container {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 12px;
      transition: transform 0.2s ease;
    }

    .ai-card:hover .ai-icon-container {
      transform: scale(1.12);
    }

    .ai-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .ai-desc {
      font-size: 11.5px;
      color: #8395a7;
      text-align: center;
      line-height: 1.3;
    }

    /* ══════════════════════════════════════════════════════════════════
       QUICK BOOKMARKS / SHORTCUTS ROW
       ══════════════════════════════════════════════════════════════════ */
    .shortcuts-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    .shortcut-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shortcut-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 255, 204, 0.4);
      color: #00ffcc;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Ambient Animated Orbs -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>CHROMIUM ENGINE ACTIVE</span>
    </div>
    <div class="clock-widget" id="liveClock">00:00:00</div>
  </div>

  <!-- Hero Content -->
  <div class="hero-container">
    <h1 class="brand-title">MR.SKY</h1>
    <p class="brand-subtitle">AI-AUGMENTED NEXT-GEN DESKTOP BROWSER</p>

    <!-- Search Form -->
    <div class="search-wrapper">
      <form class="search-form" id="searchForm">
        <div class="search-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00ffcc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search the web with Google or enter URL..." autofocus autocomplete="off" />
        <button type="submit" class="search-btn">Search</button>
      </form>
    </div>

    <!-- AI Launchpad -->
    <div class="section-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span>AI Assistants Launchpad</span>
    </div>

    <div class="ai-grid">
      <!-- ChatGPT -->
      <div class="ai-card chatgpt" onclick="openAI('chatgpt')">
        <div class="ai-icon-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10v4a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6v-4a10 10 0 0 1 10-10z"></path>
            <path d="M8 11h.01"></path>
            <path d="M16 11h.01"></path>
          </svg>
        </div>
        <div class="ai-title">ChatGPT</div>
        <div class="ai-desc">GPT-4o & Advanced Reasoning</div>
      </div>

      <!-- Gemini -->
      <div class="ai-card gemini" onclick="openAI('gemini')">
        <div class="ai-icon-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#438bf7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"></path>
          </svg>
        </div>
        <div class="ai-title">Gemini</div>
        <div class="ai-desc">Google Multimodal Intelligence</div>
      </div>

      <!-- DeepSeek -->
      <div class="ai-card deepseek" onclick="openAI('deepseek')">
        <div class="ai-icon-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00ffcc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9 10h.01"></path>
            <path d="M15 10h.01"></path>
            <path d="M9 15c1 1 5 1 6 0"></path>
          </svg>
        </div>
        <div class="ai-title">DeepSeek</div>
        <div class="ai-desc">Deep Math & Code Reasoning</div>
      </div>

      <!-- Claude -->
      <div class="ai-card claude" onclick="openAI('claude')">
        <div class="ai-icon-container">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 3v3m0 12v3M3 12h3m12 0h3"></path>
          </svg>
        </div>
        <div class="ai-title">Claude</div>
        <div class="ai-desc">Next-Gen Thinking & Artifacts</div>
      </div>
    </div>

    <!-- Quick Shortcuts -->
    <div class="shortcuts-row">
      <div class="shortcut-pill" onclick="openURL('https://youtube.com')">
        <span>▶ YouTube</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://github.com')">
        <span>⚡ GitHub</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://reddit.com')">
        <span>🌐 Reddit</span>
      </div>
      <div class="shortcut-pill" onclick="openURL('https://wikipedia.org')">
        <span>📚 Wikipedia</span>
      </div>
    </div>
  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Search Handler
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      let url;
      if (query.startsWith('http://') || query.startsWith('https://')) {
        url = query;
      } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(query)) {
        url = 'https://' + query;
      } else {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }
      window.location.href = url;
    });

    function openAI(type) {
      const urls = {
        chatgpt: "https://chatgpt.com/",
        gemini: "https://gemini.google.com/",
        deepseek: "https://chat.deepseek.com/",
        claude: "https://claude.ai/"
      };
      if (urls[type]) {
        window.location.href = urls[type];
      }
    }

    function openURL(url) {
      window.location.href = url;
    }
  </script>
</body>
</html>
