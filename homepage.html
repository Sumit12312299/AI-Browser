<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MR.SKY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0d13;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 30px 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* ══════════════════════════════════════════════════════════════════
       WALLPAPER LAYERS
       ══════════════════════════════════════════════════════════════════ */
    #wallpaper-ambient {
      position: fixed;
      top: -30px;
      left: -30px;
      right: -30px;
      bottom: -30px;
      background-size: cover;
      background-position: center center;
      filter: blur(32px) brightness(0.6);
      z-index: -3;
      display: none;
      transform: scale(1.08);
      pointer-events: none;
    }

    #wallpaper-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-position: center center;
      z-index: -2;
      display: none;
      pointer-events: none;
    }

    #wallpaper-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 13, 19, 0.45);
      z-index: -1;
      display: none;
      pointer-events: none;
      transition: background 0.15s ease;
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: -1;
    }

    /* Top Bar - Minimal Clock in Top Right */
    .top-bar {
      position: absolute;
      top: 24px;
      right: 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 2;
    }

    .clock-widget {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(20, 24, 34, 0.65);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* Main Center Container */
    .hero-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 820px;
    }

    /* Clean Brand Title */
    .brand-title {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
    }

    .brand-subtitle {
      font-size: 13px;
      color: #cbd5e1;
      letter-spacing: 0.3px;
      margin-bottom: 30px;
      font-weight: 500;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    /* Edge-Style Centered Search Capsule */
    .search-wrapper {
      width: 100%;
      max-width: 660px;
      margin-bottom: 34px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 6px 14px 6px 20px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
    }

    .search-form:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .search-form:focus-within {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(99, 160, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25), 0 10px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .search-icon {
      margin-right: 12px;
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.6);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .search-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.15s ease;
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    /* ══════════════════════════════════════════════════════════════════
       EDGE / CHROME STYLE SHORTCUTS ROW
       ══════════════════════════════════════════════════════════════════ */
    .shortcuts-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 760px;
    }

    .shortcut-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 76px;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      user-select: none;
    }

    .shortcut-tile {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(22, 27, 38, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .shortcut-card:hover .shortcut-tile {
      transform: translateY(-3px) scale(1.05);
      background: rgba(32, 40, 56, 0.95);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .shortcut-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: contain;
    }

    .shortcut-fallback-icon {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
    }

    .shortcut-title {
      font-size: 11.5px;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.8);
      margin-top: 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      letter-spacing: 0.1px;
    }

    /* Delete '×' badge on hover */
    .shortcut-delete-btn {
      position: absolute;
      top: -3px;
      right: 12px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      border: none;
      font-size: 12px;
      line-height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.15s ease;
      z-index: 5;
    }

    .shortcut-card:hover .shortcut-delete-btn {
      opacity: 1;
      transform: scale(1);
    }

    .shortcut-delete-btn:hover {
      background: #dc2626;
      transform: scale(1.15);
    }

    /* Add Shortcut Tile */
    .add-shortcut-tile {
      color: #cbd5e1;
    }

    .shortcut-card:hover .add-shortcut-tile {
      color: #ffffff;
    }

    /* ══════════════════════════════════════════════════════════════════
       ADD SHORTCUT MODAL
       ══════════════════════════════════════════════════════════════════ */
    .shortcut-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .shortcut-modal-backdrop.open {
      display: flex;
    }

    .shortcut-modal {
      width: 100%;
      max-width: 400px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    }

    .shortcut-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .shortcut-modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .shortcut-modal-close {
      background: transparent;
      border: none;
      color: #828ca0;
      font-size: 18px;
      cursor: pointer;
    }

    .shortcut-modal-close:hover {
      color: #ffffff;
    }

    .modal-input-group {
      margin-bottom: 14px;
    }

    .modal-input-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .modal-text-input {
      width: 100%;
      padding: 9px 12px;
      background: #0f121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      color: #ffffff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s ease;
    }

    .modal-text-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .shortcut-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-action-btn {
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* ══════════════════════════════════════════════════════════════════
       WALLPAPER CUSTOMIZER BUTTON & MODAL
       ══════════════════════════════════════════════════════════════════ */
    .wallpaper-trigger-btn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 24, 34, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.15s ease;
      z-index: 50;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .wallpaper-trigger-btn:hover {
      background: #1e2433;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .wallpaper-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wallpaper-modal-backdrop.open {
      display: flex;
    }

    .wallpaper-modal {
      width: 100%;
      max-width: 480px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    }

    .file-dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      background: rgba(255, 255, 255, 0.02);
    }

    .file-dropzone:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.06);
    }

    .dropzone-text {
      font-size: 13px;
      color: #e2e8f0;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .dropzone-subtext {
      font-size: 11.5px;
      color: #64748b;
    }

    .fit-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .fit-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .fit-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .fit-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-input {
      flex: 1;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-reset:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-done {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-done:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- Wallpaper Background Layers -->
  <div id="wallpaper-ambient"></div>
  <div id="wallpaper-layer"></div>
  <div id="wallpaper-overlay"></div>
  <div class="bg-grid"></div>

  <!-- Top Bar: Clock Only in Top Right -->
  <div class="top-bar">
    <div class="clock-widget" id="liveClock">00:00:00</div>
  </div>

  <!-- Hero Content -->
  <div class="hero-container">
    <h1 class="brand-title">MR.SKY</h1>
    <p class="brand-subtitle">AI-Augmented Next-Gen Desktop Browser</p>

    <!-- Edge-Style Search Capsule -->
    <div class="search-wrapper">
      <form class="search-form" id="searchForm">
        <div class="search-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="Search the web" autofocus autocomplete="off" />
        <button type="submit" class="search-btn" title="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>

    <!-- Edge/Chrome Style Shortcuts Grid -->
    <div class="shortcuts-container" id="shortcutsContainer"></div>
  </div>

  <!-- 🖼️ Floating Wallpaper Customizer Button -->
  <button class="wallpaper-trigger-btn" onclick="openWallpaperModal()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
    <span>Set Wallpaper</span>
  </button>

  <!-- ➕ Add Shortcut Modal -->
  <div class="shortcut-modal-backdrop" id="shortcutModal">
    <div class="shortcut-modal">
      <div class="shortcut-modal-header">
        <span class="shortcut-modal-title">Add shortcut</span>
        <button class="shortcut-modal-close" onclick="closeShortcutModal()">&times;</button>
      </div>
      <div class="modal-input-group">
        <label class="modal-input-label">Name</label>
        <input type="text" id="shortcutNameInput" class="modal-text-input" placeholder="e.g. YouTube, ChatGPT" />
      </div>
      <div class="modal-input-group">
        <label class="modal-input-label">URL</label>
        <input type="text" id="shortcutUrlInput" class="modal-text-input" placeholder="e.g. youtube.com or https://..." />
      </div>
      <div class="shortcut-modal-footer">
        <button class="modal-action-btn btn-secondary" onclick="closeShortcutModal()">Cancel</button>
        <button class="modal-action-btn btn-primary" onclick="saveNewShortcut()">Add</button>
      </div>
    </div>
  </div>

  <!-- 🎨 Wallpaper Settings Modal -->
  <div class="wallpaper-modal-backdrop" id="wallpaperModal">
    <div class="wallpaper-modal">
      <div class="modal-header">
        <span class="modal-title">Homepage Wallpaper Settings</span>
        <button class="modal-close-btn" onclick="closeWallpaperModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Upload Wallpaper (Any 1K, 2K, 4K, 5K Image)</label>
        <div class="file-dropzone" onclick="document.getElementById('wallpaperFileInput').click()">
          <div class="dropzone-text">📁 Click to choose wallpaper image</div>
          <div class="dropzone-subtext">Supports PNG, JPG, WEBP, AVIF in full resolution</div>
        </div>
        <input type="file" id="wallpaperFileInput" accept="image/*" style="display: none;" onchange="handleWallpaperUpload(event)" />
      </div>

      <div class="form-group">
        <label class="form-label">Screen Adjustment (Aspect Ratio)</label>
        <div class="fit-options">
          <button class="fit-btn active" id="fit-smart" onclick="setFitMode('smart')" title="Full wallpaper visible without cutting anything">
            Fit (No Crop)
          </button>
          <button class="fit-btn" id="fit-cover" onclick="setFitMode('cover')" title="Fill whole screen">
            Fill (Cover)
          </button>
          <button class="fit-btn" id="fit-stretch" onclick="setFitMode('stretch')" title="Stretch to exact window dimensions">
            Stretch
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Overlay Dimness (Text & search bar readability)</label>
        <div class="slider-row">
          <input type="range" min="10" max="85" value="50" class="slider-input" id="dimSlider" oninput="updateDimness(this.value)" />
          <span id="dimVal" style="font-size: 12px; color: #94a3b8; font-family: monospace;">50%</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-reset" onclick="resetWallpaper()">Reset to Default</button>
        <button class="modal-btn btn-done" onclick="closeWallpaperModal()">Done</button>
      </div>
    </div>
  </div>

  <script>
    // Live Clock Widget
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Search Handler
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      let url;
      if (query.startsWith('http://') || query.startsWith('https://')) {
        url = query;
      } else if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(query)) {
        url = 'https://' + query;
      } else {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
      }
      window.location.href = url;
    });

    // ══════════════════════════════════════════════════════════════════
    // EDGE / CHROME SHORTCUTS MANAGER  (IPC-persisted + localStorage backup)
    // ══════════════════════════════════════════════════════════════════
    const DEFAULT_SHORTCUTS = [
      { name: "ChatGPT",   url: "https://chatgpt.com" },
      { name: "Gemini",    url: "https://gemini.google.com" },
      { name: "YouTube",   url: "https://youtube.com" },
      { name: "GitHub",    url: "https://github.com" },
      { name: "Fast.com",  url: "https://fast.com" },
      { name: "Reddit",    url: "https://reddit.com" },
      { name: "Wikipedia", url: "https://wikipedia.org" }
    ];

    // In-memory shortcuts list (populated on DOMContentLoaded)
    let shortcutsList = null;

    async function loadShortcuts() {
      // 1️⃣ Try IPC (most reliable across restarts)
      if (ipcRenderer) {
        try {
          const data = await ipcRenderer.invoke('get-shortcuts');
          if (Array.isArray(data)) return data;
        } catch(e) {}
      }
      // 2️⃣ localStorage backup
      try {
        const stored = localStorage.getItem('mrsky_shortcuts');
        if (stored) return JSON.parse(stored);
      } catch(e) {}
      // 3️⃣ Default
      return DEFAULT_SHORTCUTS;
    }

    async function persistShortcuts(list) {
      shortcutsList = list;
      // Save via IPC → JSON file
      if (ipcRenderer) {
        try { await ipcRenderer.invoke('save-shortcuts', list); } catch(e) {}
      }
      // Save to localStorage as backup
      try { localStorage.setItem('mrsky_shortcuts', JSON.stringify(list)); } catch(e) {}
      renderShortcuts();
    }

    function getShortcuts() {
      return shortcutsList || DEFAULT_SHORTCUTS;
    }

    function saveShortcuts(list) {
      persistShortcuts(list); // async, fire-and-forget is fine
    }

    function renderShortcuts() {
      const container = document.getElementById('shortcutsContainer');
      const shortcuts = getShortcuts();
      container.innerHTML = "";

      shortcuts.forEach((sc, index) => {
        const card = document.createElement('div');
        card.className = 'shortcut-card';
        card.onclick = (e) => {
          if (!e.target.classList.contains('shortcut-delete-btn')) {
            window.location.href = sc.url;
          }
        };

        // Extract domain for high-res favicon
        let domain = "";
        try {
          domain = new URL(sc.url).hostname;
        } catch (e) {
          domain = sc.url.replace(/https?:\/\//, '').split('/')[0];
        }
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        card.innerHTML = `
          <button class="shortcut-delete-btn" onclick="deleteShortcut(${index})" title="Remove shortcut">&times;</button>
          <div class="shortcut-tile">
            <img class="shortcut-icon" src="${faviconUrl}" alt="${sc.name}" onerror="handleFaviconError(this, '${escapeHTML(sc.name)}')" />
          </div>
          <div class="shortcut-title" title="${escapeHTML(sc.name)}">${escapeHTML(sc.name)}</div>
        `;
        container.appendChild(card);
      });

      // Append '+ Add shortcut' Button
      const addCard = document.createElement('div');
      addCard.className = 'shortcut-card';
      addCard.onclick = openShortcutModal;
      addCard.innerHTML = `
        <div class="shortcut-tile add-shortcut-tile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="shortcut-title">Add shortcut</div>
      `;
      container.appendChild(addCard);
    }

    function handleFaviconError(imgEl, name) {
      const parent = imgEl.parentElement;
      const initial = name ? name.trim().charAt(0) : "W";
      parent.innerHTML = `<span class="shortcut-fallback-icon">${initial}</span>`;
    }

    function deleteShortcut(index) {
      const list = getShortcuts();
      list.splice(index, 1);
      saveShortcuts(list);
    }

    function openShortcutModal() {
      document.getElementById('shortcutNameInput').value = "";
      document.getElementById('shortcutUrlInput').value = "";
      document.getElementById('shortcutModal').classList.add('open');
      setTimeout(() => document.getElementById('shortcutNameInput').focus(), 100);
    }

    function closeShortcutModal() {
      document.getElementById('shortcutModal').classList.remove('open');
    }

    function saveNewShortcut() {
      const name = document.getElementById('shortcutNameInput').value.trim();
      let url = document.getElementById('shortcutUrlInput').value.trim();

      if (!name || !url) {
        alert("Please provide both name and URL for the shortcut.");
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const list = getShortcuts();
      list.push({ name, url });
      saveShortcuts(list);
      closeShortcutModal();
    }

    // Enter key submit in shortcut modal
    document.getElementById('shortcutUrlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveNewShortcut();
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // ══════════════════════════════════════════════════════════════════
    // RELIABLE WALLPAPER STORAGE — IPC + JSON File (userData folder)
    // Falls back to localStorage if ipcRenderer not available
    // ══════════════════════════════════════════════════════════════════
    let ipcRenderer = null;
    try {
      ipcRenderer = require('electron').ipcRenderer;
    } catch(e) {}

    let currentFitMode = 'smart';
    let currentDimness = '50';

    async function loadWallpaperConfig() {
      let config = null;
      // Try IPC first (most reliable across restarts)
      if (ipcRenderer) {
        try {
          config = await ipcRenderer.invoke('get-wallpaper-config');
        } catch(e) {}
      }
      // Fallback: localStorage
      if (!config) {
        const url = localStorage.getItem('wallpaper_url');
        if (url) {
          config = {
            url,
            fit: localStorage.getItem('wallpaper_fit') || 'smart',
            dim: localStorage.getItem('wallpaper_dim') || '50'
          };
        }
      }
      return config;
    }

    async function saveWallpaperConfig(url, fit, dim) {
      const config = { url, fit, dim };
      // Save via IPC to JSON file
      if (ipcRenderer) {
        try {
          await ipcRenderer.invoke('save-wallpaper-config', config);
        } catch(e) {}
      }
      // Also save to localStorage as backup
      try {
        localStorage.setItem('wallpaper_url', url);
        localStorage.setItem('wallpaper_fit', fit);
        localStorage.setItem('wallpaper_dim', dim);
      } catch(e) {}
    }

    async function clearWallpaperConfig() {
      if (ipcRenderer) {
        try { await ipcRenderer.invoke('clear-wallpaper-config'); } catch(e) {}
      }
      localStorage.removeItem('wallpaper_url');
      localStorage.removeItem('wallpaper_fit');
      localStorage.removeItem('wallpaper_dim');
    }

    function renderWallpaper(sourceUrl) {
      if (!sourceUrl) {
        hideWallpaper();
        return;
      }

      const layer = document.getElementById('wallpaper-layer');
      const ambient = document.getElementById('wallpaper-ambient');
      const overlay = document.getElementById('wallpaper-overlay');

      layer.style.backgroundImage = `url("${sourceUrl}")`;
      ambient.style.backgroundImage = `url("${sourceUrl}")`;

      layer.style.display = 'block';
      overlay.style.display = 'block';

      applyFitStyling(currentFitMode);
      updateDimness(currentDimness, false);
    }

    function applyFitStyling(mode) {
      const layer = document.getElementById('wallpaper-layer');
      const ambient = document.getElementById('wallpaper-ambient');

      document.querySelectorAll('.fit-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('fit-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      if (mode === 'smart') {
        layer.style.backgroundSize = 'contain';
        ambient.style.display = 'block';
      } else if (mode === 'cover') {
        layer.style.backgroundSize = 'cover';
        ambient.style.display = 'none';
      } else if (mode === 'stretch') {
        layer.style.backgroundSize = '100% 100%';
        ambient.style.display = 'none';
      }
    }

    function setFitMode(mode) {
      currentFitMode = mode;
      applyFitStyling(mode);
      // Save updated config if wallpaper is active
      const url = document.getElementById('wallpaper-layer').style.backgroundImage
        .replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
      if (url) saveWallpaperConfig(url, currentFitMode, currentDimness);
    }

    function updateDimness(val, save = true) {
      currentDimness = val;
      const overlay = document.getElementById('wallpaper-overlay');
      const opacity = parseInt(val) / 100;
      overlay.style.background = `rgba(11, 13, 19, ${opacity})`;
      document.getElementById('dimVal').innerText = `${val}%`;
      document.getElementById('dimSlider').value = val;
    }

    function hideWallpaper() {
      document.getElementById('wallpaper-layer').style.display = 'none';
      document.getElementById('wallpaper-ambient').style.display = 'none';
      document.getElementById('wallpaper-overlay').style.display = 'none';
    }

    function handleWallpaperUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Prefer native file path (Electron provides file.path)
      if (file.path) {
        const fileUrl = 'file:///' + file.path.replace(/\\/g, '/');
        renderWallpaper(fileUrl);
        saveWallpaperConfig(fileUrl, currentFitMode, currentDimness);
        closeWallpaperModal();
        return;
      }

      // Fallback: DataURL for browsers/webviews
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        renderWallpaper(dataUrl);
        saveWallpaperConfig(dataUrl, currentFitMode, currentDimness);
        closeWallpaperModal();
      };
      reader.onerror = function() {
        alert('Could not read the selected image file.');
      };
      reader.readAsDataURL(file);
    }

    async function resetWallpaper() {
      if (confirm('Reset wallpaper to default clean dark theme?')) {
        await clearWallpaperConfig();
        hideWallpaper();
        closeWallpaperModal();
      }
    }

    function openWallpaperModal() {
      document.getElementById('wallpaperModal').classList.add('open');
      document.getElementById('dimSlider').value = currentDimness;
      document.getElementById('dimVal').innerText = `${currentDimness}%`;
      applyFitStyling(currentFitMode);
    }

    function closeWallpaperModal() {
      document.getElementById('wallpaperModal').classList.remove('open');
    }

    // Startup Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      // Load shortcuts from IPC/JSON (persists across restarts)
      shortcutsList = await loadShortcuts();
      renderShortcuts();

      // Load wallpaper from persistent JSON config (IPC) or localStorage backup
      const config = await loadWallpaperConfig();
      if (config && config.url) {
        currentFitMode = config.fit || 'smart';
        currentDimness = config.dim || '50';
        renderWallpaper(config.url);
      }
    });
  </script>
</body>
</html>
