<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browsing History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0b0d13;
      color: #e2e8f0;
      padding: 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .history-container {
      width: 100%;
      max-width: 800px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 14px;
      background: #141722;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      font-size: 12.5px;
      border-radius: 6px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #191d2b;
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ef4444;
    }
    .filter-wrapper {
      margin-bottom: 18px;
    }
    .filter-input {
      width: 100%;
      padding: 10px 14px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: all 0.15s ease;
    }
    .filter-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }
    .history-item:hover {
      background: #191d2b;
      border-color: rgba(255, 255, 255, 0.12);
    }
    .history-link {
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
      flex: 1;
      margin-right: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
    }
    .history-link:hover {
      text-decoration: underline;
    }
    .time-badge {
      color: #64748b;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .empty-msg {
      color: #64748b;
      font-size: 14px;
      margin-top: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="history-container">
    <header>
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Browsing History
      </h2>
      <div class="actions">
        <button class="btn" onclick="window.location.href='homepage.html'">Home</button>
        <button class="btn btn-danger" onclick="clearHistory()">Clear History</button>
      </div>
    </header>

    <div class="filter-wrapper">
      <input type="text" id="filterInput" class="filter-input" placeholder="Search history..." />
    </div>

    <div id="list"></div>
  </div>

  <script>
    const list = document.getElementById('list');
    const filterInput = document.getElementById('filterInput');
    const history = JSON.parse(localStorage.getItem('history')) || [];

    function renderList(items) {
      list.innerHTML = "";
      if (items.length === 0) {
        list.innerHTML = '<p class="empty-msg">No history found.</p>';
        return;
      }
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const a = document.createElement('a');
        a.className = 'history-link';
        a.href = item.url;
        a.textContent = item.url;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time-badge';
        timeSpan.textContent = item.time;

        row.appendChild(a);
        row.appendChild(timeSpan);
        list.appendChild(row);
      });
    }

    renderList(history);

    filterInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = history.filter(item => item.url.toLowerCase().includes(q));
      renderList(filtered);
    });

    function clearHistory() {
      if (confirm("Are you sure you want to clear browsing history?")) {
        localStorage.removeItem('history');
        location.reload();
      }
    }
  </script>

</body>
</html>
