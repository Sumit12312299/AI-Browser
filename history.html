<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browsing History</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: monospace;
      background: radial-gradient(circle, #000, #04091a);
      color: #00ffcc;
      padding: 30px;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a3344;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    h2 {
      font-size: 26px;
      letter-spacing: 1px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: transparent;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #00ffcc;
      color: #000;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 255, 204, 0.03);
      border: 1px solid #142834;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    .history-item:hover {
      background: rgba(0, 255, 204, 0.08);
      border-color: #00ffcc55;
    }
    .history-item a {
      color: #00ffcc;
      text-decoration: none;
      word-break: break-all;
      flex: 1;
      margin-right: 20px;
    }
    .history-item a:hover {
      text-decoration: underline;
    }
    .time {
      color: #778899;
      font-size: 13px;
      white-space: nowrap;
    }
    .empty-msg {
      color: #556677;
      font-size: 16px;
      margin-top: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h2>🕘 Browsing History</h2>
    <div class="actions">
      <button onclick="window.location.href='homepage.html'">🏠 Home</button>
      <button onclick="clearHistory()">🗑️ Clear History</button>
    </div>
  </header>

  <div id="list"></div>

  <script>
    const list = document.getElementById('list');
    const history = JSON.parse(localStorage.getItem('history')) || [];

    if (history.length === 0) {
      list.innerHTML = '<p class="empty-msg">No browsing history yet.</p>';
    } else {
      history.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const a = document.createElement('a');
        a.href = item.url;
        a.textContent = item.url;

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = item.time;

        row.appendChild(a);
        row.appendChild(timeSpan);
        list.appendChild(row);
      });
    }

    function clearHistory() {
      if (confirm("Are you sure you want to clear browsing history?")) {
        localStorage.removeItem('history');
        location.reload();
      }
    }
  </script>

</body>
</html>
